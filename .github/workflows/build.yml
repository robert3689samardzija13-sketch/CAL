name: Build unsigned iOS app

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project CustomCalendar.xcodeproj \
            -scheme CustomCalendar \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/CustomCalendar.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/CustomCalendar.xcarchive/Products/Applications/CustomCalendar.app" "$RUNNER_TEMP/Payload/CustomCalendar.app"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/CustomCalendar-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomCalendar-unsigned-ipa
          path: CustomCalendar-unsigned.ipa
