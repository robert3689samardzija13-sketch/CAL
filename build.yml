name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive without signing
        run: |
          xcodebuild \
            -project CustomCalendar.xcodeproj \
            -scheme CustomCalendar \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/CustomCalendar.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/CustomCalendar.xcarchive/Products/Applications/CustomCalendar.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/CustomCalendar-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomCalendar-unsigned-ipa
          path: CustomCalendar-unsigned.ipa
          retention-days: 7
